# =============================================================================
# AGENT BOUNDARIES — SISE
# =============================================================================
# Vai trò : Quy ước phạm vi hoạt động, trách nhiệm và phân quyền của mỗi agent.
# Writer  : Project Owner + AG-00
# Reader  : Tất cả agents
# Version : 1.0.0  (đồng bộ với data_schema.yaml và openapi.yaml) 
# =============================================================================

system_name: SISE
version: "1.0.0"

# ---------------------------------------------------------------------------
# CÁC FILE HỢP ĐỒNG (Contract Files)
# Đây là tập hợp các file "luật pháp" của solution.
# AG-00 là người duy nhất có quyền write vào các file này (ngoài Project Owner).
# ---------------------------------------------------------------------------
contract_files:
  - .context/DOS.md
  - .context/data_schema.yaml
  - .context/openapi.yaml
  - .context/agent_boundaries.yaml
  - .context/Tasks.yaml

# ---------------------------------------------------------------------------
# TÀI NGUYÊN DÙNG CHUNG (Shared Resources)
# ---------------------------------------------------------------------------
shared_resources:

  # Các file mà TẤT CẢ agents chỉ được ĐỌC, không được ghi
  read_only_for_all:
    - .context/DOS.md
    - .context/data_schema.yaml
    - .context/openapi.yaml
    - .context/agent_boundaries.yaml
    - .context/Tasks.yaml
    - .knowledge/shared/KnowledgeBase_shared.md

  # Các file / thư mục chỉ AG-00 được ghi
  write_restricted_to_ag00:
    - .github/agents/               # Định nghĩa .agent.md cho từng agent
    - .github/workflows/            # CI/CD workflow files
    - .context/                     # Toàn bộ thư mục .context
    - .context/Sessions/            # Session retrospective files
    - docker-compose.yml            # Kết nối toàn bộ services

  # Các file mà agent[N] và AG-00 cùng có quyền ghi
  write_shared_per_agent:
    # Pattern: .knowledge/agent[N]/Log_[N].md  → Writer: Agent[N] + AG-00
    # Pattern: .knowledge/agent[N]/Skill_[N].md → Writer: Agent[N] (AG-00 chỉ đọc để audit)
    # Pattern: .knowledge/agent[N]/KnowledgeBase_[N].md → Writer: Agent[N] (đề xuất) + AG-00 (approve)
    note: >
      Mỗi agent chỉ được ghi vào thư mục .knowledge/agent[N]/ của chính mình.
      Không agent nào được ghi vào thư mục .knowledge/ của agent khác.

# ---------------------------------------------------------------------------
# RÀNG BUỘC TOÀN SOLUTION (Global Constraints)
# Áp dụng cho TẤT CẢ agents, không có ngoại lệ.
# ---------------------------------------------------------------------------
global_constraints:
  enforced_python_version: "3.13"

  allowed_tech_stack:
    - python
    - fastapi
    - pytorch
    - react
    - react_native
    - tailwind
    - milvus
    - postgres
    - minio
    - redis
    - docker
    - celery
    - pytest

  forbidden_libraries:
    - pandas       # Dùng polars hoặc xử lý thẳng nếu cần tabular data
    - tensorflow   # Dự án dùng PyTorch
    - flask        # Dự án dùng FastAPI

  no_secrets_in_repo: true
  # Secrets phải được đọc qua environment variables hoặc Vault.
  # Xem danh sách required_env_vars trong data_schema.yaml → security_and_secrets.

  default_timeout_ms: 10000
  default_retries: 2
  retry_backoff_ms: 500

# ---------------------------------------------------------------------------
# ĐỊNH NGHĨA AGENTS
# ---------------------------------------------------------------------------
agents:

  # -------------------------------------------------------------------------
  # AG-00 — OrchestratorAgent
  # -------------------------------------------------------------------------
  - id: AG-00
    name: OrchestratorAgent
    role: >
      Điều phối toàn solution. Giao task, kiểm soát ranh giới giữa các agent,
      quản lý contract files, audit logs, và kiểm soát việc push code lên GitHub.
      KHÔNG viết feature code cho bất kỳ module nào.
    working_dir: modules/OrchestratorAgent/

    allowed_outbound_calls:
      - "*"   # AG-00 có thể giao tiếp với tất cả agents

    forbidden_actions:
      - write_feature_code  # AG-00 không viết code logic của các module khác

    privileges:
      - modify_contract_files       # Ghi vào .context/
      - modify_agent_registry       # Ghi vào .github/agents/
      - audit_all_logs              # Đọc Log_[N].md của tất cả agents
      - audit_all_skills            # Đọc Skill_[N].md để kiểm soát chất lượng
      - block_unauthorized_commits  # Từ chối commit không tuân thủ boundaries
      - manage_sessions             # Tạo Session file sau mỗi phiên làm việc
      - manage_tasks                # Write vào .context/Tasks.yaml

  # -------------------------------------------------------------------------
  # AG-01 — AIModuleAgent
  # -------------------------------------------------------------------------
  - id: AG-01
    name: AIModuleAgent
    role: >
      Xây dựng và vận hành AI Inference Service. Chịu trách nhiệm toàn bộ
      về CLIP model loading, embedding extraction, và preprocessing pipeline.
    working_dir: modules/AIModule/

    allowed_outbound_calls:
      - AG-00   # Báo cáo vấn đề, yêu cầu unblock

    forbidden_actions:
      - direct_db_access          # Không truy cập PostgreSQL, Milvus, MinIO trực tiếp
      - write_to_common           # Không ghi vào thư mục của agent khác
      - modify_docker_compose     # AG-00 quản lý docker-compose.yml

    responsibilities:
      - CLIP model loading và warm-up (tránh cold-start)
      - Image preprocessing (resize 224×224, normalize, convert RGB)
      - Text tokenization cho CLIP
      - "POST /embed/image → float32[] vector"
      - "POST /embed/text → float32[] vector"
      - Batch processing cho bulk indexing
      - Vector normalization (output phải có shape đúng với vector_dim trong data_schema)

    knowledge_scope:
      - CLIP (OpenAI): ViT-B/32 (512-dim), ViT-L/14 (768-dim)
      - PyTorch model inference
      - Image preprocessing với Pillow
      - FastAPI async endpoints
      - Docker containerization
      # KHÔNG cần biết: database schemas, authentication, frontend

  # -------------------------------------------------------------------------
  # AG-02 — StorageModuleAgent
  # -------------------------------------------------------------------------
  - id: AG-02
    name: StorageModuleAgent
    role: >
      Xây dựng và quản lý toàn bộ hạ tầng lưu trữ: PostgreSQL schemas,
      Milvus collection, MinIO buckets, Redis cache. Không implement business logic.
    working_dir: modules/StorageModule/

    allowed_outbound_calls:
      - AG-00

    forbidden_actions:
      - implement_business_logic  # AG-02 cung cấp storage layer, không viết business rules

    services:
      - milvus      # Vector database, collection sise_v1
      - postgres    # Relational DB: users, albums, images, friends
      - minio       # Object storage: raw-images, thumbnails buckets
      - redis       # Cache layer

    responsibilities:
      - PostgreSQL schema migration (dùng Alembic)
      - Tạo Milvus collection với đúng vector_dim và index HNSW
      - Cấu hình MinIO buckets và lifecycle rules
      - Docker configs cho tất cả storage services
      - Seed scripts cho test data
      - Backup và DR scripts theo data_schema.yaml → backup_and_dr

    knowledge_scope:
      - PostgreSQL, Alembic migrations
      - Milvus collection management, HNSW indexing
      - MinIO S3-compatible API
      - Redis data structures
      - Docker Compose volumes và networking
      # KHÔNG cần biết: embedding model, frontend, business logic

  # -------------------------------------------------------------------------
  # AG-03 — BackendModuleAgent
  # -------------------------------------------------------------------------
  - id: AG-03
    name: BackendModuleAgent
    role: >
      Xây dựng FastAPI backend — "Nhạc trưởng" điều phối giữa Frontend,
      AI Service, và Storage. Chịu trách nhiệm business logic, auth, search workflow,
      và privacy filtering.
    working_dir: modules/BackendModule/

    allowed_outbound_calls:
      - AG-01   # Gọi AI Service để lấy embedding
      - AG-02   # Gọi Storage layer
      - AG-00   # Báo cáo

    forbidden_actions:
      - heavy_image_processing    # Mọi resize/embedding phải gọi qua AG-01
      - modify_other_projects     # Không ghi vào working_dir của agent khác

    responsibilities:
      - JWT Authentication (register, login, refresh token)
      - Upload pipeline điều phối (5 bước theo data_schema → transaction_semantics)
      - Search Service (image-to-image, text-to-image với privacy filter)
      - Evaluation Service (POST /eval/run → MRR, HitRate, Precision, Recall)
      - Celery task queue cho async indexing
      - Health probes (liveness, readiness)
      - Idempotency handling theo data_schema → idempotency

    knowledge_scope:
      - FastAPI (async, Pydantic, dependency injection)
      - JWT, OAuth2 patterns
      - Celery + Redis task queue
      - asyncpg (PostgreSQL async client)
      - pymilvus (Milvus Python SDK)
      - minio-py (MinIO client)
      - aioredis
      - Privacy-Aware Search logic
      # KHÔNG cần biết: CLIP internals, React, React Native

  # -------------------------------------------------------------------------
  # AG-04 — WebFrontendAgent
  # -------------------------------------------------------------------------
  - id: AG-04
    name: WebFrontendAgent
    role: >
      Xây dựng React web application. Giao diện quản lý album, tìm kiếm ảnh,
      bulk upload, và evaluation dashboard.
    working_dir: modules/frontendweb/

    allowed_outbound_calls:
      - AG-03   # Tất cả API calls đều qua Backend

    forbidden_actions:
      - call_AG-01_directly   # Không gọi thẳng AI Service
      - call_AG-02_directly   # Không gọi thẳng Storage

    responsibilities:
      - Dashboard layout (quản lý album, xem ảnh)
      - Bulk upload với Drag & Drop
      - Search UI (upload ảnh query hoặc nhập text, hiển thị grid kết quả với score)
      - Evaluation dashboard (biểu đồ MRR, Precision@K, HitRate)
      - Responsive design (laptop + tablet)
      - Build qua Vite, serve bằng Nginx trong Docker

    knowledge_scope:
      - React (hooks, context, state management)
      - Vite build tool
      - Tailwind CSS
      - Axios / fetch API
      - Nginx configuration
      # Tham chiếu openapi.yaml để biết đúng endpoint và response schema
      # KHÔNG cần biết: model internals, database schemas

  # -------------------------------------------------------------------------
  # AG-05 — MobileFrontendAgent
  # -------------------------------------------------------------------------
  - id: AG-05
    name: MobileFrontendAgent
    role: >
      Xây dựng React Native mobile application. Tận dụng camera và phần cứng
      điện thoại để cung cấp trải nghiệm tìm kiếm ảnh tức thì.
    working_dir: modules/FrontendMobile/

    allowed_outbound_calls:
      - AG-03   # Tất cả API calls đều qua Backend

    forbidden_actions:
      - call_AG-01_directly
      - call_AG-02_directly

    responsibilities:
      - Camera integration (chụp ảnh → search ngay)
      - Image picker từ thư viện điện thoại
      - Offline cache cho kết quả tìm kiếm gần nhất
      - Share extension (nhận ảnh từ app khác để search)
      - Build APK/iOS qua EAS (Expo Application Services)

    knowledge_scope:
      - React Native (Expo managed workflow)
      - Expo Camera, ImagePicker APIs
      - AsyncStorage (offline cache)
      - EAS Build & Submit
      # Tham chiếu openapi.yaml để biết đúng endpoint và response schema
      # KHÔNG cần biết: model internals, database schemas
