openapi: 3.0.3
info:
  title: SISE - Multimodal Retrieval & Privacy-Aware Search API
  description: >
    Production-ready contract for SISE.

    v1.2.0 — Cross-Module Contract Clarification Pass:
    Mỗi path được gắn nhãn kép trong summary/description:
      [implemented_by: X] = module chịu trách nhiệm code/serve endpoint này.
      [called_by: Y]      = module (hoặc "Client") gọi endpoint này.
    Quy ước Clause: A = chung, B = StorageModule (AG-02, KHÓA — không path
    nào trong tag StorageModule bị sửa nội dung so với v1.1.1, chỉ được
    tham chiếu thêm từ D), C = AIModule (AG-01, KHÓA hoàn toàn), D =
    BackendModule (AG-03, vùng sửa chính của v1.2.0), E = FrontendModule
    (AG-04, chưa audit — chỉ đóng vai "called_by" trong tài liệu này).

    Changelog v1.2.0 (so với v1.1.1):
      - [FIX Blocking#1] Tách GET getMediaMetadata (trước đây lồng sai vào
        path /media/upload/confirm, path parameter {image_id} không khớp
        URL template — vi phạm cấu trúc OpenAPI) ra path riêng /media/{image_id}.
      - [FIX Blocking#2] Sửa response 409 của requestUploadUrl: trước đây
        trả nhầm schema UploadResponse, nay trả đúng PresignedUploadResponse
        (khớp data_schema.yaml: "trả về cùng result như lần gọi đầu").
      - [FIX Blocking#3] Bổ sung response 409 (thiếu ở v1.1.1) cho
        uploadLegacy và confirmUpload, dùng chung schema UploadResponse.
      - [FIX Blocking#4] Bảng albums (data_schema.yaml v1.2.0, Clause B) đã
        bổ sung cột deleted_at — Album schema ở đây giữ nguyên field
        deleted_at (đã có từ v1.1.1) nay CHÍNH THỨC khớp DDL, không còn mâu
        thuẫn.
      - [FIX Blocking#5] Bổ sung mô tả tường minh cơ chế xác định "admin"
        cho /eval/run và /admin/reindex, tham chiếu admin_authorization
        (data_schema.yaml v1.2.0, Clause D) — dựa trên cột users.role mới.
      - [FIX Blocking#6] Bổ sung toàn bộ nhóm path /friends/* (trước đây
        hoàn toàn không tồn tại dù bảng friends có sẵn từ v1.1.0).
      - [FIX Medium#7] MetricType enum thu hẹp từ [L2, IP, COSINE] còn
        [COSINE] — khớp thực tế chỉ có 1 index HNSW (vector_cosine_ops) tồn
        tại ở data_schema.yaml. Không tạo thêm index L2/IP.
      - [FIX Medium#8] Bổ sung enum cho index_status (pending/ready/failed)
        ở các schema liên quan — trước đây chỉ có example, không có enum.
      - [FIX Medium#9 phụ] Bổ sung mô tả rõ hành vi bất đối xứng của
        friends, tham chiếu data_schema.yaml symmetry_note.
      - [FIX phụ] Thống nhất registerUser trả 409 (không phải 400) khi
        username/email đã tồn tại — khớp Tasks.yaml T005-03 acceptance
        criteria; 400 chỉ còn dùng cho lỗi định dạng input.
      - [FIX phụ] Bổ sung redis vào HealthStatus.dependencies — khớp
        data_schema.yaml v1.2.0 readiness_checks.
      - Không có path nào trong tag AIModule hay tag StorageModule bị XÓA
        hoặc SỬA NỘI DUNG response/request đã tồn tại — chỉ được tham chiếu
        thêm (vd ghi chú "called_by: D") theo đúng nguyên tắc khóa Clause B/C.
      - [FIX phụ] Bổ sung field config_validated vào HealthStatus — thay thế
        2 endpoint /scaffold/status, /scaffold/validate-config (không có
        trong hợp đồng ở bản build trước, nay gộp vào readiness check chung
        thay vì tồn tại như path riêng ngoài kiểm soát).
  version: 1.2.0
servers:
  - url: http://localhost:8000
    description: "Local development gateway (FastAPI) — [implemented_by: D]"

security:
  - BearerAuth: []

paths:
  # =====================================================================
  # [CLAUSE A] SYSTEM & HEALTH — implemented_by: D | called_by: E, internal (B/C self-report qua dependencies check của D)
  # =====================================================================
  /health/liveness:
    get:
      operationId: getLiveness
      summary: "[CLAUSE A][implemented_by:D][called_by:E,orchestrator] Service liveness probe"
      description: >
        Backend (D) trả lời câu hỏi "process có đang chạy không?". Không
        kiểm tra dependency nào (đó là việc của /health/readiness).
      tags: [System]
      responses:
        '200':
          description: Service process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/StandardError'

  /health/readiness:
    get:
      operationId: getReadiness
      summary: "[CLAUSE A][implemented_by:D][called_by:E,orchestrator] Comprehensive readiness check (dependencies)"
      description: >
        D kiểm tra 4 dependency: postgres (bao gồm pgvector extension),
        minio, ai_service (gọi C), redis. Trả header
        X-Expected-Vector-Dim để E/client validate trước khi gửi vector.
      tags: [System]
      responses:
        '200':
          description: All dependencies are ready
          headers:
            X-Expected-Vector-Dim:
              description: The vector dimension expected by this deployment (clients should validate before sending).
              schema:
                type: integer
                example: 512
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/StandardError'

  # =====================================================================
  # [CLAUSE A] AUTHENTICATION — implemented_by: D | called_by: E
  # =====================================================================
  /auth/register:
    post:
      operationId: registerUser
      summary: "[CLAUSE A][implemented_by:D][called_by:E] Register a new user"
      description: >
        D thực hiện SQLAlchemy trực tiếp vào bảng users (hợp lệ theo
        backend_owned_resources, data_schema.yaml Clause D). Password được
        hash trước khi lưu (cơ chế hash cụ thể do D quyết định ở tầng
        implementation — xem ghi chú password_hashing_note bên dưới).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string }
            examples:
              basic:
                value:
                  username: "alice"
                  email: "alice@example.com"
                  password: "P@ssw0rd!"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request — dữ liệu đầu vào SAI ĐỊNH DẠNG (thiếu trường, email không hợp lệ). KHÔNG dùng cho trường hợp trùng lặp — xem 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            [SỬA v1.2.0] Username hoặc email ĐÃ TỒN TẠI. Trước v1.2.0 tài
            liệu này ghi nhầm là 400 — nay thống nhất dùng 409 (Conflict),
            khớp Tasks.yaml T005-03 acceptance criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ERR_USER_ALREADY_EXISTS"
                message: "Username or email already registered"
        '500':
          $ref: '#/components/responses/StandardError'

  /auth/login:
    post:
      operationId: loginUser
      summary: "[CLAUSE A][implemented_by:D][called_by:E] Authenticate and obtain JWT"
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            examples:
              basic:
                value:
                  username: "alice"
                  password: "P@ssw0rd!"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/StandardError'

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: "[CLAUSE A][implemented_by:D][called_by:E] Retrieve authenticated user's profile"
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =====================================================================
  # [CLAUSE D] FRIENDS MANAGEMENT — implemented_by: D | called_by: E
  # MỚI THÊM v1.2.0 — khép lại Blocking#6 (data_schema.yaml có bảng friends
  # nhưng trước đây không có API nào tạo dữ liệu cho nó).
  # =====================================================================
  /friends:
    get:
      operationId: listFriends
      summary: "[CLAUSE D][implemented_by:D][called_by:E] List friends of the authenticated user"
      description: >
        D query bảng friends (SQLAlchemy trực tiếp, hợp lệ theo
        backend_owned_resources) WHERE user_id = current_user_id.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of friends
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends/request:
    post:
      operationId: sendFriendRequest
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Send/accept a friend relationship"
      description: >
        MVP semantics (auto-accept, không có hàng đợi pending request riêng):
        khi user A gọi endpoint này với target_user_id=B, D ghi NGAY 2 dòng
        đối xứng (A,B) và (B,A) vào bảng friends trong CÙNG 1 transaction,
        theo đúng friends_management.symmetric_write_policy
        (data_schema.yaml v1.2.0, Clause D). Đây là quyết định nghiệp vụ
        đơn giản hóa cho MVP; nếu PO muốn mô hình pending/accept riêng biệt
        (2 bước), cần một phiên bản contract kế tiếp bổ sung trạng thái
        friend_request riêng — KHÔNG nằm trong phạm vi v1.2.0.
      tags: [Friends]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id]
              properties:
                target_user_id: { type: integer }
      responses:
        '201':
          description: Friend relationship created (symmetric, 2 rows written)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  friend_id: { type: integer }
                  created_at: { type: string, format: date-time }
        '400':
          description: "target_user_id không hợp lệ hoặc bằng chính user hiện tại (self-friend)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: target_user_id không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Quan hệ bạn bè đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends/{friend_id}:
    delete:
      operationId: removeFriend
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Remove a friend relationship (symmetric delete)"
      description: >
        D xóa CẢ 2 dòng đối xứng (current_user,friend_id) và
        (friend_id,current_user) trong cùng 1 transaction, theo
        friends_management.delete_policy (data_schema.yaml v1.2.0).
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - name: friend_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Friend relationship removed (both rows deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Quan hệ bạn bè không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =====================================================================
  # [CLAUSE D] MEDIA — implemented_by: D | called_by: E
  # =====================================================================
  /media/upload-url:
    post:
      operationId: requestUploadUrl
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Request a presigned URL for direct upload to MinIO (upload_pipeline S1)"
      description: >
        D gọi MinIO SDK trực tiếp (xem transaction_semantics S1,
        data_schema.yaml v1.2.0) để tạo presigned URL — MinIO là hạ tầng
        Clause B nhưng thao tác runtime này thuộc D.
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type]
              properties:
                filename: { type: string, example: "vacation.jpg" }
                content_type: { type: string, example: "image/jpeg" }
                expected_size_mb:
                  type: integer
                  description: Optional hint of expected file size in MB (server may validate)
            examples:
              request:
                value:
                  filename: "vacation.jpg"
                  content_type: "image/jpeg"
                  expected_size_mb: 5
      responses:
        '200':
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >
            [FIX Blocking#2, v1.2.0] Duplicate idempotent request. Trước
            v1.2.0 tài liệu này SAI khi trả schema UploadResponse — nay sửa
            đúng schema PresignedUploadResponse (cùng shape với response
            200 gốc), khớp data_schema.yaml
            transaction_semantics.idempotency.behavior_on_duplicate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'

  /media/upload:
    post:
      operationId: uploadLegacy
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Legacy multipart upload proxied through backend (fallback)"
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                album_id: { type: integer }
                privacy_level: { $ref: '#/components/schemas/PrivacyLevel' }
            encoding:
              file:
                contentType: image/*
      responses:
        '201':
          description: File uploaded and metadata registered (indexing may be pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "[FIX Blocking#3, v1.2.0] Duplicate idempotent request — bổ sung mới, trước đây thiếu dù param Idempotency-Key đã khai báo."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /media/upload/confirm:
    post:
      operationId: confirmUpload
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Confirm and finalize an upload (completes S5 step)"
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_key, album_id, privacy_level]
              properties:
                object_key: { type: string, description: "The MinIO object key from presigned upload" }
                album_id: { type: integer }
                privacy_level: { $ref: '#/components/schemas/PrivacyLevel' }
                tags:
                  type: array
                  items: { type: string }
                  description: Optional tags for the uploaded image
      responses:
        '200':
          description: Upload confirmed and queued for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "[FIX Blocking#3, v1.2.0] Duplicate idempotent request — bổ sung mới."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

  # [FIX Blocking#1, v1.2.0] Tách path riêng cho getMediaMetadata — trước
  # đây bị lồng sai vào /media/upload/confirm (path parameter {image_id}
  # không tồn tại trong URL template, vi phạm cấu trúc OpenAPI 3.0).
  /media/{image_id}:
    get:
      operationId: getMediaMetadata
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Retrieve image metadata and signed GET URL (if authorized)"
      description: >
        [FIX v1.2.0] Path này TRƯỚC ĐÂY (v1.1.1 trở về trước) bị định nghĩa
        sai — lồng vào /media/upload/confirm dù khai path param {image_id},
        khiến không có URL hợp lệ nào để gọi endpoint này. Nay tách riêng.
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image metadata and access URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadata'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/{image_id}/update:
    put:
      operationId: updateMediaMetadata
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Update image metadata (album, privacy, tags)"
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                album_id: { type: integer }
                privacy_level: { $ref: '#/components/schemas/PrivacyLevel' }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Image metadata updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadata'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'

  /media/{image_id}/delete:
    delete:
      operationId: deleteMedia
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Delete (soft delete) an image"
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'

  /media:
    get:
      operationId: listMedia
      summary: "[CLAUSE D][implemented_by:D][called_by:E] List images for the authenticated user"
      tags: [Media]
      security:
        - BearerAuth: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: album_id
          in: query
          schema: { type: integer }
          description: Filter by album ID
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageMetadata'
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =====================================================================
  # [CLAUSE C — KHÓA HOÀN TOÀN] AI & INFERENCE
  # implemented_by: C (AG-01) | called_by: D
  # KHÔNG có thay đổi nội dung request/response so với v1.1.1. Chỉ bổ sung
  # nhãn called_by để làm rõ chiều giao tiếp.
  # =====================================================================
  /inference/embed/image:
    post:
      operationId: embedImage
      summary: "[CLAUSE C][implemented_by:C][called_by:D] Extract visual features using CLIP encoder"
      description: >
        Endpoint nội bộ — CHỈ được gọi bởi AG-03 (D), không public cho E.
        AG-03 gọi endpoint này trong upload_pipeline S4 (Celery Worker) và
        trong search_by_image workflow.
      tags: [AIModule]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Vector embedding returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorEmbeddingResponse'
              example:
                vector: [0.01, -0.02, 0.5, 0.0]
                dim: 512
                model: "clip-vit-b-32"
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StandardError'

  /inference/embed/text:
    post:
      operationId: embedText
      summary: "[CLAUSE C][implemented_by:C][called_by:D] Tokenize and encode text for cross-modal alignment"
      description: "Endpoint nội bộ — CHỈ được gọi bởi AG-03 (D) trong search_by_text workflow."
      tags: [AIModule]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_text]
              properties:
                query_text: { type: string }
            example:
              query_text: "sunset over a mountain"
      responses:
        '200':
          description: Text vector returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorEmbeddingResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StandardError'

  /inference/embed/batch:
    post:
      operationId: embedBatch
      summary: "[CLAUSE C][implemented_by:C][called_by:D] Extract visual features for multiple images in a single request"
      description: >
        Endpoint nội bộ — CHỈ được gọi bởi AG-03 (D), ví dụ cho
        POST /admin/reindex (batch xử lý nhiều ảnh cùng lúc).
      tags: [AIModule]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: >
            Batch processed. May contain partial failures — check failed_count
            and successful_count. Overall HTTP success does not guarantee every
            image succeeded (mirrors S3-style batch operations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchVectorEmbeddingResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StandardError'

  # =====================================================================
  # [CLAUSE D] SEARCH (APPLICATION-LEVEL WRAPPERS)
  # implemented_by: D | called_by: E
  # D nội bộ gọi C (embed) rồi gọi B (/vector/search/hybrid) — xem mô tả.
  # =====================================================================
  /search/image:
    post:
      operationId: searchByImage
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Search by image (app-level wrapper around inference + hybrid search)"
      description: >
        D gọi tuần tự: (1) POST /inference/embed/image (C) để lấy vector,
        (2) POST /vector/search/hybrid (B) để ANN search + privacy filter.
        E chỉ thấy 1 endpoint duy nhất, không biết về C/B.
      tags: [Search]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                top_k: { type: integer, default: 10 }
                metric: { $ref: '#/components/schemas/MetricType' }
                album_id: { type: integer, description: "Optional: filter results to specific album" }
      responses:
        '200':
          description: Search results by image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search/text:
    post:
      operationId: searchByText
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Search by text query (app-level wrapper around text embedding + hybrid search)"
      description: "D gọi POST /inference/embed/text (C) rồi POST /vector/search/hybrid (B)."
      tags: [Search]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_text]
              properties:
                query_text: { type: string }
                top_k: { type: integer, default: 10 }
                metric: { $ref: '#/components/schemas/MetricType' }
                album_id: { type: integer, description: "Optional: filter results to specific album" }
      responses:
        '200':
          description: Search results by text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =====================================================================
  # [CLAUSE B — KHÓA HOÀN TOÀN] VECTOR INDEXING & SEARCH
  # implemented_by: B (AG-02) | called_by: D
  # KHÔNG có thay đổi nội dung request/response so với v1.1.1 (chỉ
  # MetricType dùng chung ở components.schemas bị thu hẹp — xem FIX
  # Medium#7 — nhưng đây là thay đổi ở schema dùng chung Clause A/D, path
  # definition của B giữ nguyên).
  # =====================================================================
  /vector/index:
    post:
      operationId: indexVector
      summary: "[CLAUSE B][implemented_by:B][called_by:D] Index a vector (write to images.embedding via pgvector) and associate with image metadata"
      description: >
        CHỈ được gọi bởi AG-03 (D), cụ thể là Celery Worker trong
        upload_pipeline S4 (xem data_schema.yaml v1.2.0 — đã sửa để D KHÔNG
        được tự UPDATE cột embedding bằng SQLAlchemy, bắt buộc qua endpoint
        này). AG-04 (E) không bao giờ gọi trực tiếp endpoint này.
      tags: [StorageModule]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_id, vector]
              properties:
                image_id: { type: string, format: uuid }
                vector: { $ref: '#/components/schemas/VectorEmbedding' }
                metadata: { $ref: '#/components/schemas/ImageMetadata' }
            example:
              image_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              vector: [0.01, -0.02, 0.5]
      responses:
        '201':
          description: Vector indexed successfully (may be async)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "accepted" }
                  job_id: { type: string }
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StandardError'

  /vector/search/hybrid:
    post:
      operationId: searchHybrid
      summary: "[CLAUSE B][implemented_by:B][called_by:D] Privacy-aware hybrid ANN search (vector + structured metadata filter)"
      description: >
        CHỈ được gọi bởi AG-03 (D) — là backend cho /search/image,
        /search/text (D tự lấy vector từ C rồi gọi endpoint này của B).
        metric hiện CHỈ hỗ trợ COSINE (xem MetricType — thu hẹp v1.2.0),
        vì đây là toán tử operator_class duy nhất có index HNSW
        (data_schema.yaml, Clause B).
      tags: [StorageModule]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector: { $ref: '#/components/schemas/VectorEmbedding' }
                top_k: { type: integer, default: 10 }
                metric: { $ref: '#/components/schemas/MetricType' }
                filter: { $ref: '#/components/schemas/FilterExpression' }
            example:
              vector: [0.1, -0.2, 0.5]
              top_k: 5
              filter:
                or:
                  - field: "privacy_level"
                    op: "in"
                    value: [2]
                  - field: "user_id"
                    op: "eq"
                    value: 101
      responses:
        '200':
          description: Top-K nearest neighbors retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Bad request (e.g., vector dim mismatch or invalid filter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StandardError'

  # =====================================================================
  # [CLAUSE D] ALBUMS (CRUD) — implemented_by: D | called_by: E
  # =====================================================================
  /albums:
    get:
      operationId: listAlbums
      summary: "[CLAUSE D][implemented_by:D][called_by:E] List albums for the authenticated user"
      tags: [Albums]
      security:
        - BearerAuth: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of albums
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Album'
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAlbum
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Create a new album"
      tags: [Albums]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                is_public: { type: boolean, default: false }
      responses:
        '201':
          description: Album created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /albums/{album_id}:
    get:
      operationId: getAlbumDetails
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Get album details"
      tags: [Albums]
      security:
        - BearerAuth: []
      parameters:
        - name: album_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Album details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
    put:
      operationId: updateAlbum
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Update album details"
      tags: [Albums]
      security:
        - BearerAuth: []
      parameters:
        - name: album_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                is_public: { type: boolean }
      responses:
        '200':
          description: Album updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
    delete:
      operationId: deleteAlbum
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Delete (soft delete) an album"
      description: >
        [FIX Blocking#4] Ghi cột albums.deleted_at (bổ sung ở
        data_schema.yaml v1.2.0, Clause B — append). Trước v1.2.0, cột này
        không tồn tại trong DDL dù openapi.yaml đã cam kết hành vi soft
        delete — nay đã khớp.
      tags: [Albums]
      security:
        - BearerAuth: []
      parameters:
        - name: album_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Album deleted (soft delete — sets deleted_at)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'

  # =====================================================================
  # [CLAUSE D] EVALUATION — implemented_by: D | called_by: E (admin UI)
  # =====================================================================
  /eval/run:
    post:
      operationId: runEvaluation
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Trigger an evaluation run on indexed images (admin only)"
      description: >
        [FIX Blocking#5] Quyền admin xác định qua cột users.role (bổ sung
        data_schema.yaml v1.2.0, Clause B — append). Xem
        admin_authorization (data_schema.yaml, Clause D) cho cơ chế chi
        tiết. Trước v1.2.0, response 403 tồn tại nhưng KHÔNG có cột nào
        lưu quyền — nay đã khớp.
      tags: [EvaluationService]
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 100
                  description: Limit evaluation to N random indexed images
                seed: { type: integer, description: "Random seed for reproducibility" }
      responses:
        '202':
          description: Evaluation job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  eval_id: { type: string, format: uuid }
                  status: { type: string, example: "running" }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "users.role != 'admin' — xem admin_authorization (data_schema.yaml)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ERR_FORBIDDEN_ADMIN_ONLY"
                message: "This endpoint requires admin role"
        '500':
          $ref: '#/components/responses/StandardError'

  /eval/results/{eval_id}:
    get:
      operationId: getEvaluationResults
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Retrieve results of a completed evaluation run"
      tags: [EvaluationService]
      security:
        - BearerAuth: []
      parameters:
        - name: eval_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Evaluation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  eval_id: { type: string, format: uuid }
                  status: { type: string, example: "completed" }
                  mrr: { type: number }
                  hit_rate: { type: number }
                  precision: { type: number }
                  recall: { type: number }
                  query_count: { type: integer }
                  completed_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/StandardError'

  /eval/metrics:
    get:
      operationId: getEvaluationMetrics
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Retrieve performance benchmarking indices (MRR, HitRate, Precision, Recall)"
      tags: [EvaluationService]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Metric report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  mrr: { type: number }
                  hit_rate: { type: number }
                  precision: { type: number }
                  recall: { type: number }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/StandardError'

  # =====================================================================
  # [CLAUSE D] ADMIN — implemented_by: D | called_by: E (admin UI)
  # =====================================================================
  /admin/reindex:
    post:
      operationId: triggerReindex
      summary: "[CLAUSE D][implemented_by:D][called_by:E] Trigger reindexing of media into vector DB (admin only)"
      description: >
        [FIX Blocking#5] Cùng cơ chế admin_authorization như /eval/run.
        D gọi C (batch embedding) rồi gọi B (/vector/index) theo batch_size.
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_size: { type: integer, default: 100 }
                resume_from: { type: string }
      responses:
        '202':
          description: Reindex job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "users.role != 'admin' — xem admin_authorization (data_schema.yaml)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ERR_FORBIDDEN_ADMIN_ONLY"
                message: "This endpoint requires admin role"
        '500':
          $ref: '#/components/responses/StandardError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: >
        Unique key to prevent duplicate processing of the same upload/index request.
        Server stores idempotency keys for a configurable TTL (recommended 24h). Keys are scoped per authenticated user.
        [CLAUSE A] Mọi endpoint khai báo tham số này BẮT BUỘC phải định
        nghĩa response 409 tương ứng — xem changelog v1.2.0 FIX Blocking#3.

  responses:
    StandardError:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # --- CORE ENUMS ----------------------------------------- [CLAUSE A]
    PrivacyLevel:
      type: integer
      enum: [0, 1, 2]
      description: "0: Private, 1: Friends, 2: Public"

    MetricType:
      type: string
      enum: [COSINE]   # [FIX Medium#7, v1.2.0] Thu hẹp từ [L2, IP, COSINE].
                        # Lý do: data_schema.yaml (Clause B, KHÓA) chỉ có
                        # DUY NHẤT 1 index HNSW dùng vector_cosine_ops. Gửi
                        # metric=L2/IP trước đây sẽ không có index phù hợp
                        # (full scan hoặc lỗi tùy implementation). Nếu
                        # tương lai cần đa metric, phải bổ sung index mới ở
                        # Clause B trước — KHÔNG mở rộng enum này trước.
      default: COSINE
      description: >
        Hiện tại hệ thống CHỈ hỗ trợ COSINE — khớp với operator_class
        vector_cosine_ops (data_schema.yaml, Clause B — HNSW index duy
        nhất).

    IndexStatus:                        # [FIX Medium#8, v1.2.0 — mới tách thành schema riêng để tái sử dụng]
      type: string
      enum: [pending, ready, failed]
      description: "Khớp CHECK constraint images.index_status (data_schema.yaml, Clause B)"

    # --- VECTOR & EMBEDDING --------------------------------- [CLAUSE A/B]
    VectorEmbedding:
      type: array
      items:
        type: number
        format: float
      description: >
        Latent vector. Dimension is validated server-side against deployment config.
        Clients should call GET /health/readiness to read header X-Expected-Vector-Dim before sending vectors.
        If mismatched, server returns 400 with Error.code = ERR_VECTOR_DIM_MISMATCH.

    VectorEmbeddingResponse:
      type: object
      properties:
        vector:
          $ref: '#/components/schemas/VectorEmbedding'
        dim:
          type: integer
          description: Actual vector dimension returned by the model
        model:
          type: string
          description: Model identifier (e.g., "clip-vit-b-32")

    # --- BATCH EMBEDDING --------------------------------- [CLAUSE C]
    BatchVectorEmbeddingResponse:
      type: object
      properties:
        vectors:
          type: array
          items:
            $ref: '#/components/schemas/VectorEmbedding'
        dim:
          type: integer
          description: Dimension of each vector (uniform across the batch)
        model:
          type: string
        successful_count:
          type: integer
        failed_count:
          type: integer
        processing_time_ms:
          type: number

    # --- FILTER (RECURSIVE) --------------------------------- [CLAUSE A, dùng bởi D→B]
    FilterExpression:
      description: Recursive boolean filter for metadata. Use 'and'/'or' arrays or a leaf {field, op, value}.
      oneOf:
        - type: object
          properties:
            and:
              type: array
              items:
                $ref: '#/components/schemas/FilterExpression'
        - type: object
          properties:
            or:
              type: array
              items:
                $ref: '#/components/schemas/FilterExpression'
        - type: object
          properties:
            field:
              type: string
              description: Field name in metadata (e.g., privacy_level, user_id, tags)
            op:
              type: string
              enum: [eq, in, gt, lt, contains]
              description: Operator. Use 'contains' for JSONB array membership (tags).
            value:
              oneOf:
                - type: integer
                - type: string
                - type: array
                  items:
                    oneOf:
                      - type: integer
                      - type: string
      example:
        privacy_only:
          value:
            field: privacy_level
            op: in
            value: [2]
        user_or_public:
          value:
            or:
              - field: privacy_level
                op: in
                value: [2]
              - field: user_id
                op: eq
                value: 123
        tags_and_public:
          value:
            and:
              - field: tags
                op: contains
                value: ["nature"]
              - field: privacy_level
                op: in
                value: [2]

    # --- MEDIA & METADATA --------------------------------- [CLAUSE D]
    PresignedUploadResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        object_key:
          type: string
        expires_in_sec:
          type: integer
          example: 3600
        max_file_size_mb:
          type: integer
          example: 20
        allowed_content_types:
          type: array
          items:
            type: string
          example: ["image/jpeg", "image/png"]
        note:
          type: string
          description: "Client should upload within expires_in_sec and respect allowed_content_types."

    UploadResponse:
      type: object
      properties:
        image_id:
          type: string
          format: uuid
        minio_url:
          type: string
          format: uri
        status:
          type: string
          example: "pending"
        index_status:
          $ref: '#/components/schemas/IndexStatus'   # [FIX Medium#8] trước đây type:string+example, nay dùng enum dùng chung

    ImageMetadata:
      type: object
      properties:
        image_id: { type: string, format: uuid }
        user_id: { type: integer }
        album_id: { type: integer }
        minio_url: { type: string, format: uri }
        privacy_level: { $ref: '#/components/schemas/PrivacyLevel' }
        tags:
          type: array
          items: { type: string }
        created_at:
          type: string
          format: date-time
        index_status:
          $ref: '#/components/schemas/IndexStatus'   # [FIX Medium#8]

    # --- SEARCH RESPONSE -------------------------------------- [CLAUSE D response, dữ liệu nguồn từ B]
    SearchResultItem:
      type: object
      properties:
        image_id: { type: string, format: uuid }
        score: { type: number }
        minio_url: { type: string, format: uri }
        metadata:
          $ref: '#/components/schemas/ImageMetadata'

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        latency_ms:
          type: number
          description: Query latency in milliseconds
        top_k:
          type: integer

    # --- AUTH MODELS ----------------------------------------- [CLAUSE A]
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: "bearer" }
        expires_in: { type: integer, example: 3600 }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        role:                                          # [APPEND v1.2.0, khớp users.role mới]
          type: string
          enum: [user, admin]
          description: "Khớp cột users.role (data_schema.yaml v1.2.0, Clause B — append). Dùng cho admin_authorization."

    Album:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        title: { type: string }
        description: { type: string }
        is_public: { type: boolean }
        created_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Soft delete timestamp; null if not deleted.
            [FIX Blocking#4, v1.2.0] Field này tồn tại từ v1.1.1 nhưng
            KHÔNG khớp DDL (bảng albums thiếu cột). Nay data_schema.yaml
            v1.2.0 (Clause B, append) đã bổ sung cột — hết mâu thuẫn.

    # --- HEALTH & ERROR ----------------------------------- [CLAUSE A]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: "ready"
        timestamp:
          type: string
          format: date-time
        config_validated:
          type: boolean
          description: >
            [APPEND v1.2.0] Kết quả validate cấu hình scaffold (vd vector_dim
            khớp global_configs, presigned_url_expiry_sec > 0, các env var
            bắt buộc đã có giá trị). D (BackendModule) tự validate lúc
            startup và lúc mỗi lần gọi /health/readiness; false nghĩa là
            có ít nhất 1 config sai, dependencies bên dưới có thể vẫn
            "connected" nhưng service không nên coi là sẵn sàng phục vụ.
            Thay thế cho 2 endpoint /scaffold/status, /scaffold/validate-config
            (không còn tồn tại độc lập ngoài hợp đồng) — gộp vào readiness
            check chung.
        dependencies:
          type: object
          properties:
            postgres: { type: string, example: "connected", description: "Bao gồm cả pgvector extension (thay thế Milvus)" }
            minio: { type: string, example: "reachable" }
            ai_service: { type: string, example: "warm" }
            redis: { type: string, example: "connected", description: "[APPEND v1.2.0] Trước đây thiếu — Celery broker + idempotency-key store phụ thuộc Redis." }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "ERR_VECTOR_DIM_MISMATCH"
        message:
          type: string
          example: "Expected 512 items, received 768"
        details:
          type: object
          description: Optional structured details for debugging

