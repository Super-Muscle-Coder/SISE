phase_3:
  name: "Backend API Service — REBUILD"
  owner: AG-03
  status: backlog
  notes_from_ag00: >
    Toàn bộ 10 task dưới đây BẮT BUỘC tuân thủ AP-6 (Mock Data Impersonation
    — Workflow_Centric_Architecture.md v2.4.0 §3.2): cấm mọi hình thức trả
    dữ liệu giả lập trông như thật. Nếu chưa implement được, phải
    raise NotImplementedError tường minh.
    Definition of Done cho MỌI task ở Phase 3: (1) router đã include vào
    app/__init__.py thật — verify bằng GET /openapi.json từ app đang chạy, không
    chỉ đọc code; (2) DI trả về instance có khả năng hoạt động thật, không
    còn tham số None; (3) không còn tham chiếu Milvus dưới bất kỳ hình thức
    nào (biến env, tên hàm, comment không phải lịch sử); (4) có Dockerfile +
    docker-compose.yml + .dockerignore đầy đủ, theo đúng chuẩn đã áp dụng ở
    AIModule/StorageModule (config không bake vào image).

  tasks:

    - id: T003-00
      title: "[workflow:scaffold] Project scaffold, DI container, entry point & config management bundle (REBUILD)"
      assigned_to: AG-03
      priority: P0
      status: done
      description: |
        Dựng lại toàn bộ khung 5-layer (entities/adapters/services/routers)
        cho mọi workflow.

        [KIẾN TRÚC ENTRY POINT — QUYẾT ĐỊNH MỚI v1.2.0, THAY THẾ pattern
        main.py cũ]:
          - KHÔNG tạo file app/main.py. Composition root là app/__init__.py.
          - app/routers/__init__.py: import router con từ từng
            [workflow]_routers.py (10 file), expose một collection (vd
            all_routers: list[APIRouter]) để lớp trên lặp qua.
          - app/__init__.py: tạo instance FastAPI(...), lặp qua
            app.routers.all_routers và include_router() cho TỪNG router
            (đủ 10, không thiếu), gắn lifespan, gắn CORS middleware, rồi
            expose biến app ở module-level. app/__init__.py CHỈ lắp ráp —
            KHÔNG được gọi uvicorn.run() hay đọc CLI args ở đây.
          - backend_main.py (root module, ngang hàng configs/): ôm toàn bộ
            logic khởi động thật — đọc BACKEND_HOST/BACKEND_PORT/DEBUG từ
            env, gọi uvicorn.run("app:app", host=..., port=...,
            reload=debug). Đây là ENTRYPOINT của Dockerfile
            (python backend_main.py), trỏ tới biến app export từ
            app/__init__.py qua chuỗi import string "app:app".
          - Lý do tách: "lắp ráp app" (composition) và "khởi động app"
            (runtime/CLI concern) là 2 trách nhiệm khác nhau, không trộn
            vào 1 file. Đây là quyết định có chủ đích của Project Owner,
            khác với pattern ai_main.py/storage_main.py (đã khóa, không
            đổi lại 2 module đó) — KHÔNG coi đây là bất nhất cần fix, mà
            là 2 quy ước khác nhau cho 2 hoàn cảnh khác nhau.

        app/dependencies.py (DI trả về instance thật, có AsyncSession sống
        từ connection pool — không được để db_session=None).

        backend_requirements.txt: KHÔNG có pymilvus. KHÔNG cần package
        pgvector (Python client) — vì theo AP-2 đã làm rõ (v2.4.0), AG-03
        KHÔNG BAO GIỜ serialize/deserialize kiểu vector(512) ở tầng ORM;
        mọi thao tác cột embedding đi qua HTTP request thuần (JSON body
        chứa mảng float) tới AG-02, không cần ORM type mapping cho kiểu
        vector. Nếu một worker agent thấy cần thêm package pgvector khi
        code thực tế, đây là tín hiệu cảnh báo khả năng đang vi phạm AP-2
        (SQLAlchemy trực tiếp vào cột embedding) — phải dừng lại và báo
        AG-00 trước khi cài, không tự ý thêm.

        configs/ (backend.env.local / .example / .staging — CẢ 3 PHẢI có
        nội dung đầy đủ, không để trống bất kỳ file nào; KHÔNG còn biến
        MILVUS_*; KHÔNG cần biến PGVECTOR_* nào — lý do như trên, AG-03
        không thao tác trực tiếp pgvector).
      depends_on: [T001-04]
      acceptance_criteria:
        - Không tồn tại file app/main.py trong cây thư mục
        - app/routers/__init__.py export đủ collection chứa 10 router con
        - app/__init__.py include_router() cho ĐỦ 10 router workflow (không chỉ 2/7 như lần build trước), và KHÔNG chứa lệnh gọi uvicorn.run() hay đọc CLI/env khởi động
        - backend_main.py là nơi DUY NHẤT gọi uvicorn.run("app:app", ...), đọc BACKEND_HOST/BACKEND_PORT/DEBUG từ env
        - Dockerfile ENTRYPOINT là ["python", "backend_main.py"]
        - dependencies.py: get_auth_service() và mọi service khác trả về instance có DB session thật
        - Không còn bất kỳ biến/tên hàm/comment nào chứa "Milvus" (trừ ghi chú lịch sử nếu cần)
        - backend_requirements.txt không có pymilvus VÀ không có package pgvector (Python client)
        - configs/*.env.* không có biến MILVUS_* hoặc PGVECTOR_* nào
        - configs/backend.env.staging có nội dung đầy đủ, không rỗng
        - Dockerfile + docker-compose.yml + .dockerignore tồn tại, LABEL version khớp contract 1.2.0
        - CORS không cấu hình đồng thời allow_origins=["*"] và allow_credentials=True

    - id: T003-01
      title: "[workflow:auth] Auth Service (JWT) bundle (REBUILD)"
      assigned_to: AG-03
      priority: P0
      status: done
      description: >
        JWT auth, /auth/register, /auth/login, /auth/me theo openapi.yaml
        v1.2.0. SQLAlchemy trực tiếp bảng users (bao gồm cột role mới) theo
        backend_owned_resources (data_schema.yaml v1.2.0, Clause D).
      depends_on: [T003-00]
      acceptance_criteria:
        - POST /auth/register trả 409 (KHÔNG phải 400) khi username/email đã tồn tại
        - POST /auth/login trả 401 khi sai password
        - JWT payload chứa {user_id, username, exp} — KHÔNG lưu role (tránh stale permission, xem admin_authorization)
        - User schema response bao gồm field role
        - Router auth_routers đã include vào app/__init__.py — verify qua GET /openapi.json
      notes_from_ag00: >
        [GHI NHẬN NỢ KỸ THUẬT — v1.2.1] Response 401 (Unauthorized) hiện trả
        detail dạng string thuần ở auth_routers.py, không khớp Error schema
