# =============================================================================
# TASKS — SISE
# =============================================================================
# Vai trò : Chìa khóa điều hành. AG-00 dùng file này để giao việc cho các agent.
#           Mỗi agent đọc file này khi bắt đầu phiên làm việc để biết mình làm gì.
# Writer  : Project Owner + AG-00
# Reader  : Tất cả agents
# Version : 1.1.0
# Changelog v1.1.0:
#   - Thay thế toàn bộ tham chiếu Milvus bằng pgvector (PostgreSQL extension `vector`)
#     trong T001-02, T001-04, T003-07, T005-02, T006-02 theo data_schema.yaml v1.1.0 /
#     openapi.yaml v1.1.0 / Workflow_Centric_Architecture.md v2.3.0.
#   - Thêm phase_6: Cross-Module Structural Audit (workflow kiểm tra toàn diện từng module).
#
# QUYỀN CHỈNH SỬA:
#   - Tạo / xóa task       : AG-00 + Project Owner
#   - Cập nhật status      : Agent được assign (chỉ field: status, actual_output, notes_to_ag00)
#   - Cập nhật notes       : AG-00 + Project Owner
#
# STATUS HỢP LỆ:
#   backlog     → Task đã được định nghĩa nhưng chưa lên lịch
#   scheduled   → Task đã được lên lịch vào một session cụ thể
#   in_progress → Agent đang thực hiện trong phiên hiện tại
#   blocked     → Agent không thể tiếp tục, cần AG-00 hoặc agent khác unblock
#   review      → Agent đã hoàn thành, đang chờ AG-00 review
#   done        → AG-00 đã xác nhận hoàn thành
#   cancelled   → Task bị hủy (ghi rõ lý do trong notes)
#
# PRIORITY:
#   P0 = Critical (chặn toàn bộ pipeline nếu không làm)
#   P1 = High
#   P2 = Medium
#   P3 = Low / Nice-to-have
#
# WORKFLOW REFERENCE (tham chiếu từ mã nguồn & Workflow_Centric_Architecture.md v2.3.0):
#   - StorageModule (AG-02): schema, pgvector-index, bucket, infra_compose, seed
#   - AIModule (AG-01): warmup, image_embedding_preprocessing, image_embedding_endpoint,
#                        text_embedding, batch_embedding, ai_container
#   - BackendModule (AG-03): scaffold, auth, upload, search, media, evaluation, health
#   - FrontendWebModule (AG-04): scaffold, auth, media, upload, search, evaluation
# =============================================================================

