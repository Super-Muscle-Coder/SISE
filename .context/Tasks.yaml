# ---------------------------------------------------------------------------
# PHASE 5 — Integration & Evaluation (AG-00 điều phối)
# ---------------------------------------------------------------------------
phase_5:
  name: "Integration, Benchmarking & CI/CD"
  owner: AG-00
  status: backlog
  notes_from_ag00: >
    Tập trung hoàn tất chuỗi workflow cốt lõi end-to-end trước, sau đó mới mở
    rộng benchmarking và CI/CD nâng cao.

  tasks:

    - id: T005-01
      title: "[workflow:integration] Docker Compose full stack integration bundle"
      assigned_to: AG-00
      priority: P0
      status: backlog
      description: >
        Merge tất cả service configs vào docker-compose.yml chính.
        Cấu hình Nginx reverse proxy, internal network, volumes.
      depends_on: [T003-07, T002-06, T001-04]

    - id: T005-02
      title: "[workflow:e2e] E2E smoke test bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Chạy scripts/tests/e2e_smoke.sh: upload → embed → index → search → verify.
        Toàn bộ pipeline phải pass trong môi trường Docker Compose.
      depends_on: [T005-01]

    - id: T005-03
      title: "[workflow:benchmark] Benchmarking bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Chạy scripts/bench/mrr_benchmark.py trên test set chuẩn.
        Ghi lại embedding_latency_ms và mrr_score. So sánh HNSW vs IVF.
      depends_on: [T005-02]

    - id: T005-04
      title: "[workflow:cicd] GitHub Actions CI/CD hoàn chỉnh bundle"
      assigned_to: AG-00
      priority: P1
      status: backlog
      depends_on: [T005-02]
