        - ✓ Index name = idx_images_embedding_hnsw (match data_schema.yaml)
        - ✓ Operator class = vector_cosine_ops (match pgvector spec)
        - ✓ Tài liệu pgvector-index workflow toàn diện (guides, examples, reference)
