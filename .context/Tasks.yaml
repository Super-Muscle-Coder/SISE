# ---------------------------------------------------------------------------
# PHASE 5 — Integration & Evaluation (AG-00 điều phối)
# ---------------------------------------------------------------------------
# =============================================================================
# TASKS — SISE  (Phase 5 mở rộng + Phase 6 mới)
# =============================================================================
# Vai trò : Bổ sung cho Tasks.yaml gốc (v1.0.0).
#           Thay thế toàn bộ nội dung phase_5 hiện tại và thêm phase_6 mới.
#           Paste vào cuối Tasks.yaml, xóa phase_5 cũ.
# Writer  : Project Owner + AG-00
# Reader  : Tất cả agents
# Version : 1.1.0
