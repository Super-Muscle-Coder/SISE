    batch_embedding, ai_container) đã hoàn tất. Container production-ready,
    health probes operational, vector dimension (512) validated, sẵn sàng
    cho AG-03 integration. Phase 2 delivery approved.
    Ưu tiên theo Workflow-Centric (§2.1): warmup (T002-01) → image_embedding
    (T002-02, T002-03) → text_embedding (T002-04). Batch và Dockerfile làm sau.

  tasks:

    - id: T002-01
      title: "[workflow:warmup] CLIP model loader & warm-up bundle"
      assigned_to: AG-01
      priority: P0
      status: done
      description: >
        ✓ HOÀN THÀNH: CLIP ViT-B/32 model loaded, warm-up dummy forward pass
