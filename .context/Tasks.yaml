# ---------------------------------------------------------------------------
# PHASE 5 — Contract Verification & Module Hardening
# Mục tiêu: Đảm bảo từng module tuân thủ đúng data_schema.yaml v1.1.0 +
#           openapi.yaml v1.1.0 TRƯỚC KHI tích hợp.
# Prerequisite: Tất cả module đã build thành Docker image thành công.
# ---------------------------------------------------------------------------
phase_5:
  name: "Contract Verification & Module Hardening"
  owner: AG-00
  status: backlog
  notes_from_ag00: >
    Đây là giai đoạn "kiểm tra hộ chiếu" trước khi cho phép từng module
    qua biên giới tích hợp. Không skip. Lỗi contract ở đây → bug khó debug
    sau khi ghép stack. Thứ tự: AG-01 → AG-02 → AG-03 → AG-04.

  tasks:

    - id: T005-01
      title: "[AG-01] Contract verification: AIModule"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Kiểm tra AIModule tuân thủ đúng openapi.yaml v1.1.0 và data_schema.yaml v1.1.0.
      depends_on: []
      acceptance_criteria:
        - POST /embed/image chỉ nhận image/jpeg và image/png (per global_configs.allowed_content_types)
        - POST /embed/image từ chối file > 20MB với HTTP 413 (per global_configs.max_file_size_mb)
        - POST /embed/text nhận UTF-8 string, không nhận null hoặc empty string
        - Response vector là float32[] có đúng 512 phần tử (per global_configs.vector_dim)
        - Response shape không thay đổi giữa image và text embed (cùng dim)
        - Error response đúng StandardError schema trong openapi.yaml
        - GET /health/liveness trả HTTP 200
        - GET /health/readiness trả HTTP 200 khi model loaded, HTTP 503 khi chưa

    - id: T005-02
      title: "[AG-02] Contract verification: StorageModule"
      assigned_to: AG-02
      priority: P0
      status: backlog
      description: >
        Xác nhận StorageModule (schema, pgvector-index, bucket) khớp hoàn toàn
        với data_schema.yaml v1.1.0. Đặc biệt kiểm tra các ràng buộc hay bị bỏ sót.
      depends_on: []
      acceptance_criteria:
        - Bảng images.privacy_level có CHECK (IN (0,1,2))
        - Bảng images.index_status có CHECK (IN ('pending','ready','failed'))
        - Bảng friends có CHECK (user_id <> friend_id)
        - Tất cả 6 index bắt buộc tồn tại (idx_images_user_id, idx_images_privacy_level, idx_images_created_at, idx_images_tags_gin, idx_images_index_status, idx_friends_user_id, idx_images_embedding_hnsw)
        - Extension uuid-ossp, pgcrypto, và vector (pgvector) đã được cài
        - Index idx_images_embedding_hnsw tồn tại trên cột images.embedding, USING hnsw (embedding vector_cosine_ops) WITH (m=16, ef_construction=200)
        - Bucket raw-images và thumbnails tồn tại
        - Storage policy = private
        - Lifecycle rule thumbnails expire 365 ngày tồn tại
        - Presigned URL có thể được tạo thành công với expiry = 3600s

    - id: T005-03
      title: "[AG-03] Contract verification: BackendModule"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Kiểm tra BackendModule implement đúng openapi.yaml v1.1.0 và
        transaction_semantics trong data_schema.yaml v1.1.0.
        Focus vào 3 điểm dễ sai nhất: upload pipeline 5 bước,
        privacy filter level 1 (Friends), và idempotency.
      depends_on: []
      acceptance_criteria:
        - POST /auth/register trả 409 khi email hoặc username đã tồn tại
        - POST /auth/login trả 401 khi sai password, không trả 400
        - JWT payload chứa đúng {user_id, username, exp}
        - S1 (presigned): POST /media/upload-url trả {upload_url, object_key}
        - S3 (confirm): Sau confirm, images.index_status = 'pending' trong PostgreSQL
        - S3 compensating action: nếu PostgreSQL INSERT lỗi, MinIO object phải bị xóa
        - S4 (async index): Celery task được enqueue sau confirm thành công
        - S5 (commit): Sau Celery task thành công, index_status = 'ready'
        - Search với privacy_level = 1 (Friends) JOIN bảng friends đúng cách
        - Ảnh privacy_level = 0 không xuất hiện trong kết quả của user khác
        - Ảnh privacy_level = 1 chỉ xuất hiện với bạn bè của chủ ảnh
        - Request với Idempotency-Key trùng trả cùng job_id, không enqueue lại
        - TTL của idempotency key = 24 giờ
        - GET /health/readiness trả header X-Expected-Vector-Dim: 512
        - GET /health/readiness trả HTTP 503 khi bất kỳ dependency nào down

    - id: T005-04
      title: "[AG-04] Contract verification: FrontendWeb"
      assigned_to: AG-04
      priority: P0
      status: backlog
      description: >
        Kiểm tra Frontend không để lọt các input sai định dạng trước khi
        gửi lên Backend. Frontend là tuyến phòng thủ đầu tiên.
      depends_on: []
      acceptance_criteria:
        - Upload component từ chối file không phải image/jpeg hoặc image/png
        - Upload component từ chối file > 20MB với thông báo rõ ràng cho user
        - Không gọi /media/upload-url nếu file chưa pass local validation
        - JWT được lưu đúng nơi (không localStorage nếu lo bảo mật)
        - Axios interceptor tự động attach Bearer token vào mọi request
        - Khi JWT hết hạn, redirect về login — không crash silently
        - Không có hardcoded URL — dùng env var VITE_API_BASE_URL
        - Không gọi thẳng AI Service hay MinIO — chỉ gọi Backend

    - id: T005-05
      title: "[AG-00] Rebuild & re-tag Docker images sau contract fix"
      assigned_to: AG-00
      priority: P0
      status: backlog
      description: >
        Sau khi T005-01 → T005-04 xác nhận các lỗi contract và agents đã sửa,
        rebuild tất cả image bị ảnh hưởng, tag với version mới, push lên registry.
        Ghi lại image digest vào session log.
      depends_on: [T005-01, T005-02, T005-03, T005-04]
      acceptance_criteria:
        - Tất cả image được tag dạng {service}:{version}
        - Image digest được ghi vào .context/Sessions/ log của session này
        - docker compose pull lấy đúng version mới từ registry

# ---------------------------------------------------------------------------
# PHASE 6 — Cross-Module Structural Audit
# Mục tiêu: Kiểm tra toàn diện mỗi module từ .pyproj → app/ → Dockerfile
#           đảm bảo cấu trúc 5-lớp, dependencies, secrets management thống nhất.
# Thứ tự: AG-02 (StorageModule) → AG-01 (AIModule) → AG-03 (BackendModule)
# ---------------------------------------------------------------------------
phase_6:
  name: "Cross-Module Structural Audit"
  owner: AG-00
  status: backlog
  notes_from_ag00: >
    Đây là giai đoạn kiểm tra deep-dive cấu trúc mã nguồn của mỗi module.
    AG-00 đóng vai trò auditor, không viết code. Nếu phát hiện sai lệch,
    ghi nhận và yêu cầu agent worker sửa (không bypass, không ignore).
    Workflow kiểm tra theo thứ tự cố định: .pyproj → .env → app/ → Dockerfile.

  tasks:

    - id: T006-01
      title: "[AG-02] Structural audit: StorageModule"
      assigned_to: AG-02
      priority: P0
      status: backlog
      description: >
        Kiểm tra toàn diện StorageModule (modules/StorageModule/) theo checklist:
        1. StorageModule.pyproj: danh sách file, thư mục đúng cấu trúc
        2. storage.env.local (configs/): biến môi trường khớp v1.1.0 (pgvector params không Milvus/etcd)
        3. app/ (5 lớp): entities → adapters → services → routers
           - schema_*.py (Alembic migrations)
           - pgvector_index_*.py (thay vì collection_*.py - vốn là tiền tố cũ của Milvus)
           - bucket_*.py
           - seed_*.py
           Workflow naming: prefix = action (schema_, pgvector_index_, bucket_, seed_)
        4. Dockerfile: từ python:3.13 base, COPY app/ + storage_requirements.txt, không secrets 
        5. storage_requirements.txt: psycopg, pgvector, minio, redis, alembic (không pymilvus/milvus)
        6. .dockerignore: loại configs/, tests/, scripts/, *.pyproj, documents/
        7. infra_compose_storage.yml: pgvector/pgvector:pg16 (không milvus/etcd)
      depends_on: [T005-02]
      acceptance_criteria:
        - ✓ Không còn file prefix collection_* (đã đổi → pgvector_index_*)
        - ✓ Dockerfile LABEL version = v1.1.0 (khớp contract version)
        - ✓ Dockerfile không copy configs/ vào image
        - ✓ storage.env.local chứa PGVECTOR_* biến, không MILVUS_* / ETCD_*
        - ✓ storage_main.py CLI subcommand = pgvector-index (không collection)
        - ✓ infra_compose_storage.yml không còn service milvus/etcd
        - ✓ Tất cả workflow file naming tuân thủ Action-oriented Lexicon
        - ✓ Không còn tham chiếu Milvus trong source code (chỉ comment lịch sử)
      notes_to_ag02: >
        Focus: file naming (collection_ → pgvector_index_), Dockerfile version,
        env var naming, Docker service names. Nếu sai lệch, ghi nhận chi tiết
        và yêu cầu AG-02 sửa trước khi qua Phase 7.

    - id: T006-02
      title: "[AG-01] Structural audit: AIModule"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Kiểm tra toàn diện AIModule (modules/AIModule/) theo checklist tương tự T006-01:
        1. Workflow naming: prefix = action (warmup_, image_embedding_, text_embedding_, batch_embedding_, ai_container_)
        2. app/ (5 lớp): entities → adapters → services → routers
        3. Dockerfile: multi-stage, model không bake vào image
        4. requirements.txt: torch, clip, pillow, fastapi (vector_dim dependency)
      depends_on: [T005-01]
      acceptance_criteria:
        - ✓ Tất cả workflow file naming tuân thủ Action-oriented Lexicon
        - ✓ Dockerfile LABEL version khớp contract
        - ✓ .dockerignore tuân thủ tối thiểu: không test, scripts, documents
        - ✓ Không hardcoded vector_dim (tham chiếu từ config)
      notes_to_ag01: >
        Focus: workflow prefix (image_embedding_, text_embedding_), não hardcoded magic numbers.

    - id: T006-03
      title: "[AG-03] Structural audit: BackendModule"
      assigned_to: AG-00
      priority: P0
      status: backlog
      description: >
        Kiểm tra toàn diện BackendModule (modules/BackendModule/) theo checklist:
        1. Workflow naming (prefix): scaffold_, auth_, upload_, search_, media_, evaluation_, health_
        2. app/ (5 lớp): entities → adapters → services → routers
        3. Dockerfile: import config từ .env, health endpoints expose, không secrets
        4. requirements.txt: fastapi, sqlalchemy, psycopg, pydantic (pgvector client — tùy tuỳ nếu cần)
        5. .env cấu hình: DATABASE_URL (PostgreSQL + pgvector), không Milvus
      depends_on: [T005-03]
      acceptance_criteria:
        - ✓ Tất cả workflow file naming tuân thủ Action-oriented Lexicon
        - ✓ Dockerfile LABEL version khớp contract
        - ✓ backend_main.py entry point không hardcode config
        - ✓ /health/readiness kiểm tra pgvector extension (không milvus-client)
        - ✓ upload pipeline S4 step enqueue Celery (không block)
      notes_to_ag00: >
        Focus: transaction_semantics (5-step upload), privacy filter (Friends level),
        health check (pgvector extension validate).

    - id: T006-04
      title: "[AG-04] Structural audit: FrontendWebModule"
      assigned_to: AG-00
      priority: P0
      status: backlog
      description: >
        Kiểm tra toàn diện FrontendWebModule (modules/FrontendWebModule/) theo checklist:
        1. Workflow naming (prefix): scaffold_, auth_, media_, upload_, search_, evaluation_
        2. src/ cấu trúc (React + Vite): entities → adapters → services → (Pages + Components)
        3. .env.example: VITE_API_BASE_URL, không hardcode backend URL
        4. Dockerfile (nếu có): build image từ dist/, serve via nginx/http-server
        5. .dockerignore: loại node_modules, .env.*, src/
      depends_on: [T005-04]
      acceptance_criteria:
        - ✓ Tất cả workflow file naming tuân thủ Action-oriented Lexicon
        - ✓ Axios client sử dụng VITE_API_BASE_URL env var
        - ✓ JWT được lưu và tự động attach (interceptor)
        - ✓ Không gọi thẳng AI Service hoặc MinIO
        - ✓ Dockerfile (nếu có) không chứa secret

    - id: T006-05
      title: "[AG-00] Consolidate audit findings & issue list"
      assigned_to: AG-00
      priority: P0
      status: backlog
      description: >
        Sau T006-01 → T006-04, tập hợp tất cả finding, phân loại Blocking vs Non-blocking,
        ghi vào AUDIT_REPORT.md trong .context/. Tạo list công việc fix (nếu có)
        cho từng agent worker. Không qua Phase 7 nếu còn Blocking issues.
      depends_on: [T006-01, T006-02, T006-03, T006-04]
      acceptance_criteria:
        - ✓ AUDIT_REPORT.md tồn tại với đầy đủ finding (2 cột: Module | Finding | Severity | Assignee)
        - ✓ Blocking issues (nếu có) được ghi rõ action required
        - ✓ Non-blocking issues liệt kê trong backlog future improvement

# ---------------------------------------------------------------------------
# PHASE 7 — Integration & System Test (tương lai, sau audit Phase 6)
