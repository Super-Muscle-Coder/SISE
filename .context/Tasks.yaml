# =============================================================================
# TASKS — SISE
# =============================================================================
# Vai trò : Chìa khóa điều hành. AG-00 dùng file này để giao việc cho các agent.
#           Mỗi agent đọc file này khi bắt đầu phiên làm việc để biết mình làm gì.
# Writer  : Project Owner + AG-00
# Reader  : Tất cả agents
# Version : 1.0.0
#
# QUYỀN CHỈNH SỬA:
#   - Tạo / xóa task       : AG-00 + Project Owner
#   - Cập nhật status      : Agent được assign (chỉ field: status, actual_output, notes_to_ag00)
#   - Cập nhật notes       : AG-00 + Project Owner
#
# STATUS HỢP LỆ:
#   backlog     → Task đã được định nghĩa nhưng chưa lên lịch
#   scheduled   → Task đã được lên lịch vào một session cụ thể
#   in_progress → Agent đang thực hiện trong phiên hiện tại
#   blocked     → Agent không thể tiếp tục, cần AG-00 hoặc agent khác unblock
#   review      → Agent đã hoàn thành, đang chờ AG-00 review
#   done        → AG-00 đã xác nhận hoàn thành
#   cancelled   → Task bị hủy (ghi rõ lý do trong notes)
#
# PRIORITY:
#   P0 = Critical (chặn toàn bộ pipeline nếu không làm)
#   P1 = High
#   P2 = Medium
#   P3 = Low / Nice-to-have
# =============================================================================

# ---------------------------------------------------------------------------
# PHASE 0 — Khởi tạo Solution & Cấu hình
# Mục tiêu: Dựng nền tảng để tất cả agents có thể bắt đầu làm việc độc lập
# ---------------------------------------------------------------------------
phase_0:
  name: "Solution Bootstrap & Configuration"
  owner: AG-00
  status: done

  tasks:

    - id: T000-01
      title: "Khởi tạo repo và cấu trúc thư mục"
      assigned_to: AG-00
      priority: P0
      status: done
      description: >
        Tạo mono-repo trên GitHub với đúng cấu trúc thư mục theo DOS.md mục 5.
        Bao gồm: .context/, .knowledge/, .github/agents/, modules/, docker-compose.yml skeleton.
      depends_on: []
      acceptance_criteria:
        - Repo tồn tại trên GitHub với branch strategy đã thiết lập
        - Toàn bộ thư mục đúng theo cấu trúc trong DOS.md

    - id: T000-02
      title: "Viết và commit toàn bộ contract files"
      assigned_to: AG-00
      priority: P0
      status: done
      description: >
        Commit DOS.md, data_schema.yaml, openapi.yaml, agent_boundaries.yaml,
        Tasks.yaml vào .context/. Đây là "luật pháp" của solution, phải có trước
        khi bất kỳ agent nào bắt đầu code.
      depends_on: [T000-01]
      acceptance_criteria:
        - Tất cả 5 contract files tồn tại trong .context/ trên main branch
        - Không file nào chứa placeholder chưa điền

    - id: T000-03
      title: "Cấu hình .agent.md cho tất cả agents"
      assigned_to: AG-00
      priority: P0
      status: done
      description: >
        Viết nội dung đầy đủ cho 6 file .agent.md trong .github/agents/.
        Mỗi file phải định nghĩa rõ role, responsibilities, constraints, và
        knowledge_scope để agent không hoạt động sai domain.
      depends_on: [T000-02]
      acceptance_criteria:
        - 6 file .agent.md tồn tại trong .github/agents/ với nội dung đầy đủ
        - Không file nào còn nội dung template mặc định

    - id: T000-04
      title: "Khởi tạo .knowledge/ cho tất cả agents"
      assigned_to: AG-00
      priority: P1
      status: done
      description: >
        Commit KnowledgeBase_[N].md cho 6 agents vào .knowledge/agent[N]/.
        Tạo Skill_[N].md và Log_[N].md rỗng với header template sẵn.
        Commit KnowledgeBase_shared.md vào .knowledge/shared/.
      depends_on: [T000-02]
      acceptance_criteria:
        - Mỗi agent có đủ 3 file trong .knowledge/agent[N]/
        - KnowledgeBase_shared.md tồn tại trong .knowledge/shared/

    - id: T000-05
      title: "Thiết lập GitHub Actions CI/CD skeleton"
      assigned_to: AG-00
      priority: P1
      status: done
      description: >
        Tạo workflow files cơ bản trong .github/workflows/:
        ci.yml (lint + test on PR), build.yml (Docker build on merge to main).
        Chưa cần đầy đủ logic, chỉ cần skeleton chạy được.
      depends_on: [T000-01]
      acceptance_criteria:
        - Workflow chạy không lỗi khi push PR
        - Badge CI hiển thị trên README

# ---------------------------------------------------------------------------
# PHASE 1 — Storage Infrastructure (AG-02)
# Mục tiêu: Toàn bộ storage layer sẵn sàng trước khi bất kỳ service nào cần đến
# ---------------------------------------------------------------------------
phase_1:
  name: "Storage Infrastructure"
  owner: AG-02
  status: review
  notes_from_ag00: >
    Ưu tiên theo Workflow-Centric (Workflow_Centric_Architecture.md §2.2):
    schema (T001-01) → collection (T001-02) → bucket (T001-03). Các tiện ích
    khác (docker-compose, seed data) làm sau khi 3 mắt xích cốt lõi hoàn tất.

  tasks:

    - id: T001-01
      title: "[workflow:schema] PostgreSQL schema migration bundle"
      assigned_to: AG-02
      priority: P0
      status: review
      description: >
        Workflow bundle "schema": viết Alembic migrations + các file cùng prefix
        `schema_...` (entities/adapters/services/routers nếu cần) để quản trị DDL.
        Tạo đủ 4 bảng: users, friends, albums, images và indexes theo
        data_schema.yaml → database_spec.postgresql. Chạy migration trong Docker local.
      depends_on: [T000-02]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `schema_`
        - alembic upgrade head chạy không lỗi
        - Tất cả bảng và indexes tồn tại đúng schema
        - alembic downgrade head~1 chạy không lỗi (rollback được)
      notes_from_ag00: >
        Ưu tiên bảng friends — đây là bảng hay bị bỏ quên nhất nhưng bắt buộc
        cho privacy_level = 1 (Friends). Xem data_schema.yaml → notes.privacy_level_1_query.

    - id: T001-02
      title: "[workflow:collection] Milvus collection setup bundle"
      assigned_to: AG-02
      priority: P0
      status: review
      description: >
        Workflow bundle "collection": tạo collection sise_v1 với schema đúng
        theo data_schema.yaml → milvus. Cấu hình HNSW M=16, efConstruction=200.
        Script/setup thuộc workflow này dùng prefix `collection_...` và idempotent.
      depends_on: [T000-02]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `collection_`
        - Collection sise_v1 tồn tại và loaded
        - Index type HNSW với metric COSINE
        - vector_dim = 512 (theo data_schema.yaml → global_configs.vector_dim)
        - Insert test vector và query thành công

    - id: T001-03
      title: "[workflow:bucket] MinIO bucket initialization bundle"
      assigned_to: AG-02
      priority: P0
      status: review
      description: >
        Workflow bundle "bucket": tạo 2 buckets raw-images, thumbnails và
        lifecycle rules theo data_schema.yaml → minio.lifecycle_rules. Script
        init idempotent, file thuộc workflow dùng prefix `bucket_...`.
      depends_on: [T000-02]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `bucket_`
        - Cả 2 buckets tồn tại với đúng policy
        - Upload test object và download lại thành công
        - Lifecycle rules được apply

    - id: T001-04
      title: "[workflow:infra_compose] Docker Compose storage stack bundle"
      assigned_to: AG-02
      priority: P0
      status: review
      description: >
        Workflow bundle "infra_compose": docker-compose.storage.yml cho postgres,
        milvus-standalone, etcd, minio, redis. File/script liên quan dùng prefix
        `infra_compose_...` (nếu có). Cấu hình volumes persistent. AG-00 merge sau.
      depends_on: [T001-01, T001-02, T001-03]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `infra_compose_` 
        - docker compose up chạy thành công, tất cả containers healthy
        - Sau khi restart containers, data vẫn còn
        - Health check pass cho tất cả services

    - id: T001-05
      title: "[workflow:seed] Seed script test data bundle"
      assigned_to: AG-02
      priority: P1
      status: review
      description: >
        Workflow bundle "seed": script tạo dữ liệu mẫu (5 users, 10 albums,
        50 images metadata). File thuộc workflow dùng prefix `seed_...`.
        Dùng cho AG-03 và AG-04 test logic mà không cần AI service.
      depends_on: [T001-01, T001-02, T001-03]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `seed_`
        - Script chạy không lỗi
        - Data tồn tại trong PostgreSQL và MinIO sau khi chạy

# ---------------------------------------------------------------------------
# PHASE 2 — AI Inference Service (AG-01)
# Mục tiêu: AI Service sẵn sàng nhận request embed và trả về vector đúng chiều
# ---------------------------------------------------------------------------
phase_2:
  name: "AI Inference Service"
  owner: AG-01
  status: backlog
  notes_from_ag00: >
    Ưu tiên theo Workflow-Centric (§2.1): warmup (T002-01) → image_embedding
    (T002-02, T002-03) → text_embedding (T002-04). Batch và Dockerfile làm sau.

  tasks:

    - id: T002-01
      title: "[workflow:warmup] CLIP model loader & warm-up bundle"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Workflow bundle "warmup": load CLIP ViT-B/32, warm-up dummy forward pass
        khi khởi động. File thuộc workflow dùng prefix `warmup_...`.
        Model ở trạng thái eval() và sẵn sàng ngay sau startup event.
      depends_on: [T000-02]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `warmup_`
        - Service khởi động không có cold-start delay sau lần đầu
        - Model loaded đúng device (CPU/GPU auto-detect)

    - id: T002-02
      title: "[workflow:image_embedding] Image preprocessing pipeline bundle"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Workflow bundle "image_embedding": ImagePreprocessor nhận PIL.Image hoặc
        bytes, convert RGB, resize 224×224, normalize CLIP mean/std. File thuộc
        workflow dùng prefix `image_embedding_...`.
      depends_on: [T002-01]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `image_embedding_`
        - Xử lý đúng ảnh grayscale (2D) bằng cách expand thành RGB
        - Xử lý đúng ảnh có alpha channel (RGBA → RGB)
        - Output tensor có shape (1, 3, 224, 224)

    - id: T002-03
      title: "[workflow:image_embedding] POST /embed/image endpoint bundle"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Workflow bundle "image_embedding": endpoint nhận multipart/form-data,
        chạy qua ImagePreprocessor → CLIP image encoder → trả float32[] vector.
        File thuộc workflow dùng prefix `image_embedding_...`.
      depends_on: [T002-01, T002-02]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `image_embedding_`
        - Trả về vector có len() == 512
        - Latency < 500ms trên CPU (không có GPU)
        - Xử lý đúng content-type validation (chỉ nhận image/jpeg, image/png)

    - id: T002-04
      title: "[workflow:text_embedding] POST /embed/text endpoint bundle"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Workflow bundle "text_embedding": endpoint nhận JSON {"text": "..."},
        chạy CLIP text encoder → trả float32[] vector. File thuộc workflow dùng
        prefix `text_embedding_...`.
      depends_on: [T002-01]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `text_embedding_`
        - Trả về vector có len() == 512
        - Text encoding nằm trong cùng vector space với image encoding (CLIP guarantee)

    - id: T002-05
      title: "[workflow:batch_embedding] Batch embedding endpoint bundle"
      assigned_to: AG-01
      priority: P1
      status: backlog
      description: >
        Workflow bundle "batch_embedding": POST /embed/batch nhận danh sách ảnh,
        trả danh sách vectors. File thuộc workflow dùng prefix `batch_embedding_...`.
      depends_on: [T002-03]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `batch_embedding_`
        - Hỗ trợ batch size tối thiểu 32 ảnh
        - Không OOM khi batch = 32 trên máy không có GPU

    - id: T002-06
      title: "[workflow:ai_container] Dockerfile cho AI Service bundle"
      assigned_to: AG-01
      priority: P0
      status: backlog
      description: >
        Workflow bundle "ai_container": Dockerfile multi-stage cho AI Service.
        File thuộc workflow dùng prefix `ai_container_...` (nếu có). Image nhỏ
        gọn, model weights không baked vào image.
      depends_on: [T002-03, T002-04]
      acceptance_criteria:
        - Tất cả file thuộc workflow này bắt đầu bằng prefix `ai_container_` (nếu có)
        - docker build thành công
        - Container khởi động và /health/liveness trả 200

# ---------------------------------------------------------------------------
# PHASE 3 — Backend API (AG-03)
# Mục tiêu: FastAPI backend đầy đủ logic, test được qua Swagger UI
# ---------------------------------------------------------------------------
phase_3:
  name: "Backend API Service"
  owner: AG-03
  status: backlog
  notes_from_ag00: >
    Ưu tiên theo Workflow-Centric (§2.3): auth (T003-02) → upload (T003-03)
    → indexing (phụ thuộc T003-03 + T002-03) → search (T003-04) → evaluation
    (T003-06). CRUD (T003-05) và health probes (T003-07) làm sau scaffold.

  tasks:

    - id: T003-01
      title: "[workflow:scaffold] Project scaffold & dependencies bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Workflow bundle "scaffold": khởi tạo FastAPI project trong
        modules/BackendModule/, cấu trúc 5 lớp. File thuộc workflow dùng prefix
        `scaffold_...` (nếu có). Thiết lập Pydantic settings đọc env vars theo
        data_schema.yaml → security_and_secrets.required_env_vars.
      depends_on: [T001-04]

    - id: T003-02
      title: "[workflow:auth] Auth Service (JWT) bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Workflow bundle "auth": POST /auth/register, POST /auth/login theo
        openapi.yaml. File thuộc workflow dùng prefix `auth_...`.
      depends_on: [T003-01]

    - id: T003-03
      title: "[workflow:upload] Upload pipeline (5 bước) bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Workflow bundle "upload": implement pipeline theo
        data_schema.yaml → transaction_semantics. File thuộc workflow dùng prefix
        `upload_...`. Gồm presigned URL, metadata insert, Celery enqueue, idempotency.
      depends_on: [T003-01, T001-04, T002-06]
      notes_from_ag00: >
        Xem data_schema.yaml → transaction_semantics.upload_pipeline.
        Đặc biệt chú ý S3: nếu PostgreSQL insert lỗi phải xóa MinIO object (compensating action).

    - id: T003-04
      title: "[workflow:search] Search Service (image + text) bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Workflow bundle "search": POST /search/image và /search/text theo openapi.
        File thuộc workflow dùng prefix `search_...`. Privacy filter đúng theo
        data_schema.yaml → notes.privacy_level_1_query; enrich metadata từ PostgreSQL.
      depends_on: [T003-02, T001-01, T001-02, T002-03]

    - id: T003-05
      title: "[workflow:media] Album & Media CRUD bundle"
      assigned_to: AG-03
      priority: P1
      status: backlog
      description: >
        Workflow bundle "media": CRUD cho albums/images theo openapi.yaml.
        File thuộc workflow dùng prefix `media_...`. Có soft delete (deleted_at).
      depends_on: [T003-02]

    - id: T003-06
      title: "[workflow:evaluation] Evaluation Service bundle"
      assigned_to: AG-03
      priority: P1
      status: backlog
      description: >
        Workflow bundle "evaluation": POST /eval/run, tính MRR/HitRate@K/
        Precision@K/Recall. File thuộc workflow dùng prefix `evaluation_...`.
      depends_on: [T003-04]

    - id: T003-07
      title: "[workflow:health] Health probes bundle"
      assigned_to: AG-03
      priority: P0
      status: backlog
      description: >
        Workflow bundle "health": GET /health/liveness và /health/readiness.
        File thuộc workflow dùng prefix `health_...`. Readiness check postgres,
        milvus, minio, ai_service; include header X-Expected-Vector-Dim.
      depends_on: [T003-01]

