# =============================================================================
# SISE — Root Project Docker Compose
# =============================================================================
# Purpose: Orchestration layer only. This file does NOT define any service
#          from scratch — it merges (via multiple -f layers) with the
#          module-level compose files and only ADDS:
#            1. Ownership of the shared network "sise_network"
#               (driver, subnet, ipam — the ONLY place this is defined).
#            2. Cross-module startup ordering via depends_on overrides.
#          Everything else (image, build, healthcheck, volumes, ports, env_file)
#          is inherited unchanged from each module's own compose file.
#
# [APPEND — Fix ngay sau su co mat du lieu ngay 08/08/2026]
# THEM DONG "name: sise" O DAU FILE — LY DO BAT BUOC PHAI CO:
#   Neu khong khai "name:" tuong minh, Docker Compose tu dat project
#   name theo TEN THU MUC CHUA FILE -f DAU TIEN trong lenh (o day la
#   "modules/StorageModule/", vi infra_compose_storage.yml luon dung
#   dau theo quy uoc lenh chuan cua du an) -> project name tu dong
#   thanh "storagemodule". He qua: BAT KY ban clone nao khac cua repo
#   nay chay dung lenh multi-file -f nay SE TU DONG RA CUNG PROJECT
#   NAME "storagemodule", va do do TRO VAO CHUNG CAC VOLUME VAT LY Y
#   HET NHAU (postgres_data, minio_data, redis_data) — du 2 ban clone
#   nam o 2 duong dan hoan toan khac nhau tren o dia. Mot lenh
#   "down -v" chay o ban clone test se XOA LUON du lieu that cua ban
#   chinh. Khai "name: sise" co dinh dut diem van de nay.
#
# LUU Y QUAN TRONG CON LAI (khong tu dong giai quyet boi "name:"):
#   Neu van co tinh chay dung project name "sise" o 2 thu muc khac
#   nhau, 2 noi do VAN se share chung volume, vi ten volume chi phu
#   thuoc project name, khong phu thuoc duong dan thu muc nguon. Luon
#   luon "stop" (khong "down -v") moi truong khong can dung truoc khi
#   chay "up" o moi truong con lai.
#
# Usage (Compose merges files left-to-right, base first):
#   docker compose \
#     -f modules/StorageModule/infra_compose_storage.yml \
#     -f modules/AIModule/docker-compose.yml \
#     -f modules/BackendModule/docker-compose.yml \
#     -f docker-compose.yml \
#     up -d
# =============================================================================

name: sise

services:
  ai-service:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

networks:
  sise_network:
    name: sise_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16