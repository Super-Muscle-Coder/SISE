# =============================================================================
# Docker Compose — AI Module (AIModule)
# =============================================================================
# Purpose: Defines and builds the ai-service. Network ownership has moved
#          to the root project compose (see Changelog below) — this file
#          only JOINS the shared network, it does not create it.
#
# Configuration Strategy:
#   - NO configs/ baked in image (.dockerignore prevents it)
#   - Environment variables injected via env_file (ai.env.local), NOT
#     hardcoded in this file, NOT baked into the image.
#   - Image is transport layer — all configuration applied at container
#     start time.
#
# Changelog v1.1.0 -> v1.1.1:
#   [APPEND v1.1.1] AIModule is no longer the network owner. Network
#   "sise_network" is now created and managed EXCLUSIVELY by the root
#   docker-compose.yml (E:\SISE\docker-compose.yml). This file now only
#   joins it via external: true. Same rationale as StorageModule v1.2.3:
#   avoid any single module becoming an implicit "network owner" — if
#   AIModule were `down`, the network would previously be torn down with
#   it, breaking StorageModule/BackendModule connectivity even though
#   they were never stopped themselves.
#   Standalone use (this file alone, without the root compose) now
#   requires running first:
#     docker network create sise_network
#
# Usage:
#   docker-compose -f infra_compose_ai.yml up -d      # Standalone (module only)
#   docker-compose logs -f ai-service                 # Follow logs
#   docker-compose down                               # Stop this module only
#
# Notes:
#   - To integrate with StorageModule/BackendModule, use the root-level
#     docker-compose.yml, which merges this file via multiple -f layers
#     and adds cross-module depends_on ordering (Storage -> AI -> Backend).
#   - env_file points at configs/ai.env.local — the same file audited and
#     verified throughout AIModule's structural audit (T006-02).
# =============================================================================

services:
  ai-service:
    # Build from the Dockerfile in this directory
    #
    # LƯU Ý QUAN TRỌNG VỀ ĐƯỜNG DẪN TƯƠNG ĐỐI (đã audit và sửa):
    # Khi chạy bằng nhiều cờ -f (multi-file), Docker Compose tính TOÀN BỘ
    # đường dẫn tương đối (context, env_file, volumes) dựa trên thư mục
    # chứa FILE -f ĐẦU TIÊN trong lệnh, KHÔNG PHẢI theo thư mục chứa
    # chính file YAML này. Theo đúng quy ước lệnh chuẩn của dự án
    # (infra_compose_storage.yml luôn là file -f đầu tiên), mọi đường dẫn
    # dưới đây được viết tương đối TỪ modules/StorageModule/ đi ra, dùng
    # "../AIModule/...". Điều này khiến file KHÔNG CÒN chạy standalone
    # đúng nếu gọi trực tiếp "cd modules/AIModule && docker-compose up"
    # — chỉ hỗ trợ đúng cách chạy multi-file -f từ thư mục gốc dự án.
    build:
      context: ../AIModule
      dockerfile: Dockerfile

    container_name: sise-ai
    image: sise-ai:v1.1.0

    ports:
      - "8001:8001"

    env_file:
      - ../AIModule/configs/ai.env.local

    volumes:
      - ../AIModule/models:/app/ai-service/model_cache

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; conn = http.client.HTTPConnection('localhost', 8001); conn.request('GET', '/health/liveness'); exit(0 if conn.getresponse().status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sise_network

networks:
  sise_network:
    external: true
    name: sise_network

volumes:
  models:
    driver: local

# =============================================================================
# INTEGRATION NOTES
# =============================================================================
# Root-level orchestration (recommended for full-stack runs):
#   docker compose \
#     -f modules/StorageModule/infra_compose_storage.yml \
#     -f modules/AIModule/infra_compose_ai.yml \
#     -f modules/BackendModule/docker-compose.yml \
#     -f docker-compose.yml \
#     up -d
#
# The root docker-compose.yml adds:
#   ai-service:
#     depends_on:
#       postgres:   { condition: service_healthy }
#       minio:      { condition: service_healthy }
#       redis:      { condition: service_healthy }
# on top of this file's own service definition (merged by service name
# "ai-service" — must match exactly, which it does).
# =============================================================================