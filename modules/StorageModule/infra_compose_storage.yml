# version: 1.2.1
# Changelog v1.2.1:
#           [APPEND v1.2.1] Ép tên cố định, tránh phụ thuộc
#           COMPOSE_PROJECT_NAME prefix ngẫu nhiên khi
#           BackendModule join vào bằng external network.
#           Không đổi driver/subnet/service nào khác.
services:
  postgres:
    # pgvector/pgvector:pg16 bundles the vector extension (>= 0.7.0) with PostgreSQL 16.
    # Replaces plain postgres:16-bookworm + etcd + milvus (removed in v1.1.0).
    image: pgvector/pgvector:pg16
    container_name: sise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sise_password}
      POSTGRES_DB: ${POSTGRES_DB:-sise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - storage_net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: sise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - storage_net
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: sise-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      /usr/bin/mc mb --ignore-existing minio/raw-images &&
      /usr/bin/mc mb --ignore-existing minio/thumbnails &&
      echo 'MinIO buckets initialized successfully'
      "
    networks:
      - storage_net
    restart: on-failure

  redis:
    image: redis:7.4-alpine
    container_name: sise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - storage_net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  storage_net:
    name : sise_storage_net 
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16