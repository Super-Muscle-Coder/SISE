# version: 1.2.3
# Changelog v1.2.1:
#           [APPEND v1.2.1] Ép tên cố định, tránh phụ thuộc
#           COMPOSE_PROJECT_NAME prefix ngẫu nhiên khi
#           BackendModule join vào bằng external network.
#           Không đổi driver/subnet/service nào khác.
# Changelog v1.2.2:
#           [APPEND v1.2.2] Đổi tên network từ storage_net -> sise_network để thống nhất network của toàn bộ module.
# Changelog v1.2.3:
#           [APPEND v1.2.3] StorageModule không còn là network owner. Network "sise_network"
#           giờ được tạo và quản lý duy nhất bởi docker-compose.yml ở root dự án
#           (E:\SISE\docker-compose.yml). File này chỉ join vào bằng external: true.
#           Lý do: tránh 1 module bất kỳ (ở đây là StorageModule) trở thành "network owner"
#           ẩn định — nếu StorageModule bị `down`, network sẽ bị xóa theo, kéo sập
#           kết nối của AIModule/BackendModule dù bản thân chúng không hề down.
#           Dùng standalone (chỉ riêng module này, không qua root) yêu cầu chạy trước:
#           docker network create sise_network
services:
  postgres:
    # pgvector/pgvector:pg16 bundles the vector extension (>= 0.7.0) with PostgreSQL 16.
    # Replaces plain postgres:16-bookworm + etcd + milvus (removed in v1.1.0).
    image: pgvector/pgvector:pg16
    container_name: sise-postgres
    env_file:
      - ./configs/storage.env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sise_network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: sise-minio
    command: server /data --console-address ":9001"
    # storage.env.local phải có ĐỦ CẢ 2 cặp biến:
    #   MINIO_ACCESS_KEY / MINIO_SECRET_KEY (dùng bởi các service khác)
    #   MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (tên biến CHÍNH THỨC mà
    #   image minio/minio yêu cầu — không dùng environment: để đổi tên
    #   biến ở đây, vì cú pháp ${VAR} trong environment: KHÔNG đọc được
    #   biến đã nạp từ chính env_file của cùng service, chỉ đọc từ biến
    #   cấp shell/session — đã xác nhận qua warning "variable is not set"
    #   khi thử cách đó.)
    env_file:
      - ./configs/storage.env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sise_network
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: sise-minio-init
    env_file:
      - ./configs/storage.env.local
    depends_on:
      minio:
        condition: service_healthy
    # LƯU Ý QUAN TRỌNG: dùng $$VAR (2 dấu $, không phải ${VAR:-default})
    # để buộc CHÍNH SHELL BÊN TRONG CONTAINER đọc biến môi trường tại
    # thời điểm nó thực thi (lúc đó env_file đã được nạp vào process),
    # thay vì để Docker Compose tự thay thế ${VAR} TRƯỚC KHI container
    # khởi động — tại bước đó Compose chỉ biết biến cấp shell/session
    # của máy host, hoàn toàn chưa biết nội dung env_file, nên luôn rơi
    # về giá trị mặc định sai (đã xác nhận qua lỗi thật: mc báo "Access
    # Key Id does not exist" vì nhận nhầm "minioadmin" thay vì giá trị
    # thật SISE_MINIO_ADMIN).
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 \$$MINIO_ACCESS_KEY \$$MINIO_SECRET_KEY &&
      /usr/bin/mc mb --ignore-existing minio/raw-images &&
      /usr/bin/mc mb --ignore-existing minio/thumbnails &&
      echo 'MinIO buckets initialized successfully'
      "
    networks:
      - sise_network
    restart: on-failure

  redis:
    image: redis:7.4-alpine
    container_name: sise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sise_network
    restart: unless-stopped

  # ===== Khởi tạo schema — chạy MỖI LẦN "up" (idempotent, đã xác nhận
  # an toàn với AG-02: dùng toàn DDL "IF NOT EXISTS", tự thoát nhanh
  # không làm gì nếu DB đã ở đúng trạng thái head). Đây chính là bước
  # từng bị thiếu, gây lỗi "pgvector extension is not installed" khi
  # chạy trên volume Postgres hoàn toàn mới. =====
  storage-init:
    build:
      context: ../StorageModule
      dockerfile: Dockerfile
    image: sise-storage:v1.2.3
    container_name: sise-storage-init
    command: ["python", "storage_main.py", "init"]
    env_file:
      - ./configs/storage.env.local
    environment:
      # Override tường minh — KHÔNG dùng ${POSTGRES_USER} kiểu Compose
      # thay thế biến (đã xác nhận qua thực nghiệm thật lần thứ 2 trong
      # cùng dự án: cú pháp ${VAR} trong environment: KHÔNG đọc được
      # biến đã nạp từ env_file của CHÍNH service đó — nó chỉ đọc biến
      # cấp shell/session máy host, không có thì rơi về chuỗi rỗng,
      # gây lỗi "connection to server ... failed"). Viết thẳng giá trị
      # cố định khớp đúng storage.env.local — đây là giá trị hằng số
      # của dự án, không phải bí mật cần tham số hóa runtime.
      DATABASE_URL: "postgresql+psycopg://SISE_POSTGRES_ADMIN:Daucatmoi12345@postgres:5432/sise"
      MINIO_ENDPOINT: "http://minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sise_network
    # Job chạy 1 lần rồi thoát (exit code 0) — "no" tránh Docker liên
    # tục restart nó dù đã chạy xong thành công.
    restart: "no"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  sise_network:
    external: true
    name: sise_network